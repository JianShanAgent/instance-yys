# 复制为 config/secrets.yaml 后填写（secrets.yaml 不入库）
qq:
  app_id: "YOUR_APP_ID"
  client_secret: "YOUR_APP_SECRET"

postgres:
  dsn: "postgresql://jianshanagent:jianshanagent@postgres:5432/jianshanagent"

redis:
  url: "redis://redis:6379/0"

llm:
  # 小米 MiMo 密钥。接口地址在 core.llm.yaml 的 base_url，密钥类型要与之对应：
  # Token Plan 用 tp-/ttp- 开头的密钥，按量付费用 sk- 开头的密钥
  api_key: "YOUR_MIMO_API_KEY"

wiki:
  # 一个 wiki 一段，段名是 core.wiki.yaml 里那个 wiki 的 id。BWiki 不需要凭据，不用写
  huiji:
    # Cloudflare 放行密钥；随 core.wiki.yaml 里 auth_header 指定的请求头发送
    authkey: "YOUR_WIKI_AUTHKEY"
    # 可选：需要额外 Cookie 时填
    cookie: ""

siliconflow:
  # 硅基流动密钥（sk- 开头）。它的 Qwen3-VL-Embedding-8B 做法和官方不一样、检索质量差，现在只有评测脚本用它；可留空
  api_key: ""

gitee_ai:
  # 模力方舟（Gitee AI，ai.gitee.com）密钥：嵌入用它（core.embedding.yaml 的 providers.gitee），
  # 联网搜索选模力方舟时也用它（core.websearch.yaml 的 providers.gitee_ai）；留空则向量检索不可用
  api_key: ""

mimo_search:
  # 小米 MiMo「按量付费」密钥（sk- 开头），只有联网搜索用它（core.websearch.yaml 的 providers.mimo）。
  # 和上面 llm 的 Token Plan 密钥（tp- 开头）不通用；账号要在控制台的「插件管理」里开通「联网服务插件」。
  # 留空则没有联网搜索
  api_key: ""

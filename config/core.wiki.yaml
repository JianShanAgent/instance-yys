# 这个机器人服务的 wiki：阴阳师的两个 wiki，灰机和 BWiki。只写和核心默认值不一样的项，
# 各项的含义见核心仓库的 src/jianshanagent/defaults/core.wiki.yaml。

name: "阴阳师"                      # 提示词里用它：「你是阴阳师 wiki 机器人的查证员」
about: "网易手游"                   # 向模型交代背景时用（「阴阳师（网易手游）」）

# 挂着的 wiki：知识库各建各的、一起检索，/查 各查各的，回答里标明出处。
# 排第一的是主 wiki：人设、对话和查证的提示词用的是它的站点插件的补充。
# 这一段不能在管理后台里改，要改就改这个文件再发布。
wikis:
  - id: huiji                       # 这个 wiki 在这个部署里的名字：知识库的目录名、密钥的键
    label: "灰机 wiki"              # 回答里标出处用
    api_url: "https://yys.huijiwiki.com/api.php"
    # wiki 在 Cloudflare 后面，请求要带放行请求头才不会被挑战页拦截。
    # 这里只写请求头名；密钥在 secrets.yaml 的 wiki.huiji.authkey（不入库）
    auth_header: "X-authkey"
    # 站点插件：灰机上的阴阳师 wiki（jianshanagent-site-huiji-yys），
    # 它的上级灰机平台（jianshanagent-site-huiji）会先加载
    site: huiji_yys

  - id: bwiki
    label: "BWiki"
    # BWiki 的站都在同一个域名下，一站一个目录：三项地址都带着目录名，页面地址里没有 /wiki/
    api_url: "https://wiki.biligame.com/yys/api.php"
    site_base: "https://wiki.biligame.com/yys"
    article_path: "/$1"
    # 站点插件：BWiki 上的阴阳师剧情百科（jianshanagent-site-bwiki-yys），
    # 它的上级 BWiki 平台（jianshanagent-site-bwiki）会先加载
    site: bwiki_yys
